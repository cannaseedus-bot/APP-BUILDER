<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASX PRIME OS — KLH Hive Browser + Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg-main: #020309;
    --bg-app: #050814;
    --bg-panel: #05080faa;
    --accent: #16f2aa;
    --accent-soft: #0ef0c0;
    -- text-soft: #8be9fd;
  }

  body {
    margin: 0;
    background: var(--bg-main);
    height: 100vh;
    overflow: hidden;
    font-family: system-ui, monospace;
    color: var(--accent);
  }

  /* K’UHUL + KLH Hybrid Pulse */
  #kuhul-splash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #051014 0%, #020309 80%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999999;
    animation: fadeOut 3.5s forwards ease-in-out;
  }

  @keyframes hiveGlow {
    0% { filter: drop-shadow(0 0 2px #0ef0c0); }
    40% { filter: drop-shadow(0 0 22px #16f2aa); }
    80% { filter: drop-shadow(0 0 12px #0ef0c0); }
    100% { filter: drop-shadow(0 0 2px #0ef0c0); }
  }

  @keyframes fadeOut {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }

  /* KLH HUD Container */
  #hive-hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 42px;
    background: #050811aa;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #0ef0c055;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 9999;
    font-size: 14px;
  }

  #hive-hud span {
    opacity: .85;
  }

  #hive-status {
    color: #0ef0c0;
    font-weight: bold;
  }

  /* ASXR layout */
  #asxr-shell {
    position: absolute;
    inset: 42px 0 0 0;
    display: flex;
    flex-direction: column;
    background: #050814;
  }

  /* Matrix rain canvas behind app */
  #matrix-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.18;
  }

  /* Main app content above matrix */
  #asxr-app {
    position: relative;
    z-index: 1;
    flex: 1;
    display: none;
    padding: 14px 16px 0 16px;
    color: #e8fff6;
    overflow-y: auto;
  }

  #asxr-app h1 {
    margin: 0 0 6px 0;
    font-size: 18px;
  }

  #asxr-app p {
    margin: 0 0 10px 0;
    font-size: 13px;
    color: #8be9fd;
  }

  /* Shard Monitor Panel */
  #shard-panel {
    position: fixed;
    right: 14px;
    top: 62px;
    width: 280px;
    height: calc(100vh - 80px);
    background: var(--bg-panel);
    border-left: 1px solid #16f2aa44;
    backdrop-filter: blur(10px);
    padding: 12px;
    overflow-y: auto;
    color: #8be9fd;
    display: none;
    z-index: 9998;
  }

  .shard {
    padding: 6px 0;
    border-bottom: 1px solid #16f2aa22;
    font-size: 12px;
  }

  .shard-title {
    color: #16f2aa;
    font-weight: bold;
    margin-bottom: 2px;
  }

  /* KLH Terminal Dock */
  #terminal-dock {
    position: relative;
    z-index: 2;
    height: 200px;
    border-top: 1px solid #16f2aa33;
    background: #02040a;
    display: flex;
    flex-direction: column;
  }

  #terminal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    font-size: 12px;
    background: #050811;
    border-bottom: 1px solid #16f2aa22;
  }

  #terminal-log {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    line-height: 1.3;
    color: #8be9fd;
    overflow-y: auto;
  }

  .term-line {
    white-space: pre-wrap;
  }
  .term-line.cmd { color: #16f2aa; }
  .term-line.out { color: #8be9fd; }
  .term-line.err { color: #ff5555; }
  .term-line.sys { color: #50fa7b; }

  #terminal-input-row {
    display: flex;
    align-items: center;
    padding: 4px 8px;
    border-top: 1px solid #16f2aa22;
    font-size: 12px;
  }

  #terminal-prompt {
    margin-right: 6px;
    color: #16f2aa;
  }

  #terminal-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e8fff6;
    font-family: inherit;
    font-size: 12px;
  }

  #terminal-help {
    font-size: 10px;
    color: #6ad3ff;
    opacity: .8;
    padding: 0 8px 4px 8px;
  }

  button.khl-chip {
    padding: 2px 6px;
    margin-left: 4px;
    font-size: 10px;
    border-radius: 999px;
    border: 1px solid #16f2aa66;
    background: #02040c;
    color: #8be9fd;
    cursor: pointer;
  }

  button.khl-chip:hover {
    background: #07111c;
  }
</style>
</head>

<body>

<!-- 🔱 K’UHUL + KLH HYBRID BOOT SPLASH -->
<div id="kuhul-splash">
  <div style="width:44vh; height:44vh; animation:hiveGlow 3s infinite;">
    <!-- Official K'uhul Core SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7800 6000">
      <defs>
        <linearGradient id="kcore" x1="5937" y1="6199" x2="1860" y2="-199">
          <stop offset="0" stop-color="#05080d"/>
          <stop offset="0.45" stop-color="#0ef0c0"/>
          <stop offset="1" stop-color="#16f2aa"/>
        </linearGradient>
        <filter id="kglow" height="300%" width="300%" x="-100%" y="-100%">
          <feGaussianBlur stdDeviation="70" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect x="305" y="304" width="7188" height="5391" fill="url(#kcore)"/>
      <path filter="url(#kglow)" fill="#16f2aa"
        d="M3380 4282c0,-396 119,-740 295,-919 -116,-7 -285,-55 -393,-253 -307,-558 73,-1494 73,-1494l-33 -33c0,0 -474,588 -416,1878 36,813 420,1280 618,1469 -88,-178 -144,-404 -144,-648zm849 429c0,221 -95,400 -212,400 -117,0 -212,-179 -212,-400 0,-221 95,-400 212,-400 117,0 212,179 212,400zm-523 269c0,0 -367,-1372 245,-1372 702,0 392,1380 392,1380 0,0 13,-833 -367,-833 -294,0 -269,825 -269,825zm159 -1736c28,-8 56,-12 85,-12 24,0 49,3 72,8 45,-181 116,-604 -27,-1119 -192,-687 -461,-849 -461,-849l-57 57c0,0 441,572 441,1086 0,394 -36,705 -53,828zm288 56c81,57 153,146 212,259 77,-187 202,-641 2,-1332 -269,-929 -661,-1159 -661,-1159l-69 69c0,0 535,535 592,1180 41,460 -31,816 -75,982zm-276 -2411l-73 82c0,0 816,686 816,1902 0,433 -93,788 -151,968 34,134 53,283 53,441 0,313 -58,595 -161,787 236,-314 469,-908 529,-1836 90,-1380 -1012,-2343 -1012,-2343z"/>
    </svg>
  </div>
</div>

<!-- 🔷 KLH HUD BAR -->
<div id="hive-hud">
  <span>KLH HIVE — PRIME-04</span>
  <span id="hive-status">booting…</span>
  <span style="cursor:pointer;" onclick="toggleShardPanel()">shards ▦</span>
</div>

<!-- 🟩 KLH Shard Monitor -->
<div id="shard-panel"></div>

<!-- 🌐 ASXR Shell (matrix + app + terminal) -->
<div id="asxr-shell">
  <canvas id="matrix-layer"></canvas>

  <div id="asxr-app">
    <h1>ASXR Browser</h1>
    <p>Hive is warming up… waiting for KLH signals.</p>
  </div>

  <!-- KLH Terminal Dock -->
  <div id="terminal-dock">
    <div id="terminal-header">
      <span>KLH Terminal · K'uhul VM · SCXQ2</span>
      <div>
        <button class="khl-chip" onclick="quickCmd('status')">status</button>
        <button class="khl-chip" onclick="quickCmd('models')">models</button>
        <button class="khl-chip" onclick="quickCmd('help')">help</button>
      </div>
    </div>
    <div id="terminal-help">
      Commands: <b>status</b>, <b>models</b>, <b>help</b>, <b>compress &lt;text&gt;</b>
    </div>
    <div id="terminal-log"></div>
    <div id="terminal-input-row">
      <span id="terminal-prompt">»</span>
      <input id="terminal-input" autocomplete="off" spellcheck="false" />
    </div>
  </div>
</div>

<script>
  function toggleShardPanel() {
    const panel = document.getElementById("shard-panel");
    panel.style.display = (panel.style.display === "none" || !panel.style.display)
      ? "block" : "none";
  }

  /* ---------- Matrix Rain (vertical stack) ---------- */
  (function matrixRain() {
    const canvas = document.getElementById('matrix-layer');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight - 42;

    const columns = Math.floor(width / 16);
    const drops = Array(columns).fill(0);

    const chars = '0123456789ABCDEF';

    function draw() {
      ctx.fillStyle = 'rgba(2, 3, 9, 0.25)';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#16f2aa';
      ctx.font = '14px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * 16;
        const y = drops[i] * 18;

        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        } else {
          drops[i]++;
        }
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 42;
    });

    draw();
  })();

  /* ---------- Terminal + SW wiring ---------- */

  const termLog = document.getElementById('terminal-log');
  const termInput = document.getElementById('terminal-input');

  function appendTermLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'term-line ' + (cls || 'out');
    div.textContent = text;
    termLog.appendChild(div);
    termLog.scrollTop = termLog.scrollHeight;
  }

  function sendTerminalCommand(command) {
    appendTermLine('» ' + command, 'cmd');

    function postNow(controller) {
      if (!controller) {
        appendTermLine('[sw] no controller yet', 'err');
        return;
      }
      controller.postMessage({
        type: 'terminal_command',
        command
      });
    }

    if (navigator.serviceWorker.controller) {
      postNow(navigator.serviceWorker.controller);
    } else {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        postNow(navigator.serviceWorker.controller);
      }, { once: true });
    }
  }

  termInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const cmd = termInput.value.trim();
      if (cmd) {
        sendTerminalCommand(cmd);
      }
      termInput.value = '';
    }
  });

  termInput.addEventListener('blur', () => {
    // keep focus in terminal by default
    setTimeout(() => termInput.focus(), 50);
  });

  function quickCmd(cmd) {
    termInput.value = cmd;
    sendTerminalCommand(cmd);
    termInput.value = '';
  }

  // Receive messages from KLH kernel
  navigator.serviceWorker.addEventListener('message', (event) => {
    const data = event.data || {};

    if (data.type === "boot_stage") {
      document.getElementById("hive-status").textContent = data.stage;
      appendTermLine(`[boot] ${data.stage}`, 'sys');

      if (data.stage === "ui_ready") {
        document.getElementById("asxr-app").style.display = "block";
      }
    }

    if (data.type === "klh_shards") {
      let html = "";
      data.shards.forEach(s => {
        html += `<div class="shard">
                   <div class="shard-title">${s.name.toUpperCase()}</div>
                   <div>Port: ${s.port}</div>
                   <div>Routes: ${s.routes.length}</div>
                 </div>`;
      });
      document.getElementById("shard-panel").innerHTML = html;
      appendTermLine(`[klh] shards: ${data.shards.map(x => x.name).join(', ')}`, 'sys');
    }

    if (data.type === "terminal_output") {
      appendTermLine(data.message, 'out');
    }
  });

  /* ---------- Service Worker Registration ---------- */

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.khl')
      .then(reg => {
        appendTermLine('[sw] registered KLH kernel', 'sys');
      })
      .catch(err => {
        appendTermLine('[sw] registration failed: ' + err, 'err');
      });
  } else {
    appendTermLine('[sw] service worker not supported', 'err');
  }

  // Ensure input is ready
  window.addEventListener('load', () => {
    setTimeout(() => termInput.focus(), 600);
  });
</script>

</body>
</html>
