<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ASX Studio Generator v2 • GitHub Import</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#020308; --panel:#050915;
      --accent:#00eaff; --accent-soft:rgba(0,234,255,.18);
      --text:#e8fff6;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
      background:radial-gradient(circle at top,#071221,#010308 60%,#000 100%);
      color:var(--text);
    }
    header{
      padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
      backdrop-filter:blur(18px);
      background:linear-gradient(120deg,rgba(0,234,255,.18),rgba(3,12,30,.9));
      border-bottom:1px solid rgba(0,234,255,.4);
    }
    .logo{font-weight:700;letter-spacing:3px;font-size:16px;}
    nav a{
      margin-left:16px;font-size:13px;text-decoration:none;color:var(--text);
      padding:6px 10px;border-radius:999px;border:1px solid transparent;
    }
    nav a.active, nav a:hover{
      border-color:rgba(0,234,255,.7);
      background:radial-gradient(circle at top,var(--accent-soft),transparent);
    }
    main{padding:18px 20px;display:grid;grid-template-columns:420px 1fr;gap:16px;}
    .card{
      background:linear-gradient(145deg,#050915,#040711);
      border-radius:16px;border:1px solid rgba(0,234,255,.35);
      box-shadow:0 0 24px rgba(0,0,0,.8),0 0 18px var(--accent-soft);
      padding:18px;
    }
    .title{font-size:19px;font-weight:650;margin-bottom:4px;}
    .subtitle{font-size:11px;opacity:.78;margin-bottom:12px;}
    label{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8;}
    input{
      width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      padding:8px 10px;background:rgba(1,4,10,.9);color:var(--text);
      font-size:13px;outline:none;margin-bottom:10px;
    }
    button{
      padding:9px 14px;border-radius:999px;border:none;
      background:linear-gradient(120deg,#00eaff,#16f2aa);
      color:#020308;font-size:13px;font-weight:600;cursor:pointer;
      box-shadow:0 0 18px rgba(0,234,255,.65);
    }
    button:active{transform:scale(.98);}
    #log{font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:220px;overflow-y:auto;}
  </style>
</head>
<body>
  <header>
    <div class="logo">ASX STUDIOGEN • GITHUB IMPORT</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="studio.html">New Studio</a>
      <a href="github.html" class="active">Import GitHub</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="title">Import GitHub Repository</div>
      <div class="subtitle">Register a repository as a studio project. You can later convert it into an ASXTape.</div>
      <label>Repository URL</label>
      <input id="repo-url" placeholder="https://github.com/username/repository.git" />
      <label>Project Name (optional)</label>
      <input id="project-name" placeholder="Auto-detected from URL if empty" />
      <button id="import-btn">Import Repository</button>
    </section>

    <section class="card">
      <div class="title">Activity Log</div>
      <div id="log"></div>
    </section>
  </main>

  <script>
    const log = (msg) => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      const t = new Date().toLocaleTimeString();
      line.textContent = `[${t}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log('[GitHubImport]', msg);
    };

    document.getElementById('import-btn').onclick = async () => {
      const repo_url = document.getElementById('repo-url').value.trim();
      const project_name = document.getElementById('project-name').value.trim() || null;
      if (!repo_url) {
        log('✖ Please enter a repository URL.');
        return;
      }
      log('→ Registering repo: ' + repo_url);
      try {
        const res = await fetch('/api/studio/import-github', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_url, project_name })
        });
        const data = await res.json();
        if (!data.ok) {
          log('✖ Error: ' + (data.error || 'unknown'));
          return;
        }
        log('✓ Registered. Project folder: ' + data.project);
      } catch (e) {
        log('✖ Request failed: ' + e);
      }
    };
  </script>
<script src="/public/asx-runtime.js"></script>

</body>
</html>
