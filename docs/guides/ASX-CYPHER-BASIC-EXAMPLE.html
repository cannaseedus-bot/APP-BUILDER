<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚛️ ASX Boot Splash</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#0ff;font-family:monospace;overflow:hidden;}
#splash, #main{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1s;}
#splash img{width:220px;max-width:50%;animation:float 3s ease-in-out infinite alternate;}
#splash p{margin-top:1rem;color:#00ffffaa;font-size:1.1rem;}
@keyframes float{0%{transform:translateY(0);}100%{transform:translateY(-6px);}}
#main{opacity:0;pointer-events:none;}
.show{opacity:1;pointer-events:auto;}
</style>
</head>
<body>
<div id="splash">
  <img src="https://joeslist.refluxedpc.com/friendly-bot.png" alt="Micronaut Boot">
  <p>We are already booted — we just want to look cool like the other runtimes that have to boot..</p>
</div>

<div id="main">
  <h1>⚛️ Atomic ASX Runtime Online</h1>
  <p>Everything’s already running locally.</p>
  <button onclick="alert('Runtime active!')">Ping Engine</button>
</div>

<script>
setTimeout(()=>{
  document.getElementById("splash").style.opacity=0;
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    const m=document.getElementById("main");
    m.classList.add("show");
  },1000);
},13500); // fake boot duration
</script>
</body>
</html>
