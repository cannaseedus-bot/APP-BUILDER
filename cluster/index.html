<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Background circle -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#bgGrad)" />

  <!-- Outer neon ring -->
  <circle cx="160" cy="160" r="145"
          fill="none"
          stroke="#22f7c7"
          stroke-width="2"
          stroke-opacity="0.5" />

  <!-- GOAT / π HORNS -->
  <!-- Left horn -->
  <path d="
    M 85 85
    C 65 70, 60 45, 80 35
    C 100 25, 125 35, 135 60
    C 140 72, 142 82, 144 92"
    fill="none"
    stroke="url(#hornGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- Right horn -->
  <path d="
    M 235 85
    C 255 70, 260 45, 240 35
    C 220 25, 195 35, 185 60
    C 180 72, 178 82, 176 92"
    fill="none"
    stroke="url(#hornGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- π bridge between horns -->
  <path d="M 130 90 L 200 90"
        fill="none"
        stroke="url(#hornGrad)"
        stroke-width="10"
        stroke-linecap="round" />

  <!-- GOAT HEAD -->
  <circle cx="160" cy="120" r="32"
          fill="#020617"
          stroke="#22f7c7"
          stroke-width="3" />

  <!-- Eyes -->
  <circle cx="148" cy="118" r="4" fill="#22f7c7" />
  <circle cx="172" cy="118" r="4" fill="#22f7c7" />

  <!-- Nose -->
  <circle cx="156" cy="132" r="2.5" fill="#22f7c7" />
  <circle cx="164" cy="132" r="2.5" fill="#22f7c7" />

  <!-- Little goatee -->
  <path d="M 156 140 L 160 148 L 164 140"
        fill="none"
        stroke="#22f7c7"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Ears -->
  <path d="M 132 116 L 118 110 L 124 126 Z"
        fill="#020617"
        stroke="#22f7c7"
        stroke-width="2"/>
  <path d="M 188 116 L 202 110 L 196 126 Z"
        fill="#020617"
        stroke="#22f7c7"
        stroke-width="2"/>

  <!-- SHIELD BODY -->
  <path d="
    M 160 145
    L 105 165
    L 112 220
    C 118 250, 136 270, 160 278
    C 184 270, 202 250, 208 220
    L 215 165 Z"
    fill="url(#shieldGrad)"
    stroke="#0f172a"
    stroke-width="4" />

  <!-- Inner shield outline -->
  <path d="
    M 160 155
    L 115 172
    L 121 217
    C 126 242, 140 256, 160 262
    C 180 256, 194 242, 199 217
    L 205 172 Z"
    fill="none"
    stroke="#022c22"
    stroke-width="2" />

  <!-- LOCK (security icon) -->
  <!-- Lock body -->
  <rect x="134" y="180" width="52" height="42"
        rx="8" ry="8"
        fill="#020617"
        stroke="#22f7c7"
        stroke-width="3" />

  <!-- Lock shackle -->
  <path d="
    M 145 180
    C 145 166, 152 156, 160 156
    C 168 156, 175 166, 175 180"
    fill="none"
    stroke="#22f7c7"
    stroke-width="3"
    stroke-linecap="round" />

  <!-- Keyhole -->
  <circle cx="160" cy="198" r="4" fill="#22f7c7" />
  <rect x="157" y="202" width="6" height="10" rx="3"
        fill="#22f7c7" />

  <!-- POLYGLOT RING (language dots) -->
  <g opacity="0.9">
    <circle cx="88" cy="190" r="3" fill="#22f7c7" />
    <circle cx="100" cy="215" r="3" fill="#eab308" />
    <circle cx="118" cy="236" r="3" fill="#38bdf8" />
    <circle cx="202" cy="236" r="3" fill="#22f7c7" />
    <circle cx="220" cy="215" r="3" fill="#eab308" />
    <circle cx="232" cy="190" r="3" fill="#38bdf8" />
  </g>

  <!-- TEXT: PI GOAT -->
  <text x="160" y="305"
        text-anchor="middle"
        fill="#e5e7eb"
        font-family="Consolas, Menlo, monospace"
        font-size="14">
    π GOAT · POLYGLOT SECURITY
  </text>
</svg>
