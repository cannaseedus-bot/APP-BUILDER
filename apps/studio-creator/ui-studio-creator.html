<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ASX Studio Generator v2 • New Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#020308; --panel:#050915;
      --accent:#00eaff; --accent-soft:rgba(0,234,255,.18);
      --text:#e8fff6;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
      background:radial-gradient(circle at top,#071221,#010308 60%,#000 100%);
      color:var(--text);
    }
    header{
      padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
      backdrop-filter:blur(18px);
      background:linear-gradient(120deg,rgba(0,234,255,.18),rgba(3,12,30,.9));
      border-bottom:1px solid rgba(0,234,255,.4);
    }
    .logo{font-weight:700;letter-spacing:3px;font-size:16px;}
    nav a{
      margin-left:16px;font-size:13px;text-decoration:none;color:var(--text);
      padding:6px 10px;border-radius:999px;border:1px solid transparent;
    }
    nav a.active, nav a:hover{
      border-color:rgba(0,234,255,.7);
      background:radial-gradient(circle at top,var(--accent-soft),transparent);
    }
    [scx~="HUD"]{
      position:fixed;inset:54px 0 0 0;
      display:grid;grid-template-columns:400px 1fr;
      gap:10px;padding:10px;
    }
    [scx~="PANEL"]{
      background:linear-gradient(145deg,#050915,#040711);
      border-radius:16px;border:1px solid rgba(0,234,255,.35);
      box-shadow:0 0 24px rgba(0,0,0,.8),0 0 18px var(--accent-soft);
      backdrop-filter:blur(14px);
    }
    [scx~="FORM"]{padding:18px;display:flex;flex-direction:column;gap:12px;}
    [scx~="LABEL"]{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8;}
    [scx~="INPUT"],[scx~="TEXTAREA"],select{
      width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      padding:8px 10px;background:rgba(1,4,10,.9);color:var(--text);
      font-size:13px;outline:none;
    }
    [scx~="TEXTAREA"]{resize:vertical;min-height:90px;}
    [scx~="BTN-PRIMARY"]{
      padding:9px 14px;border-radius:999px;border:none;
      background:linear-gradient(120deg,#00eaff,#16f2aa);
      color:#020308;font-size:13px;font-weight:600;cursor:pointer;
      box-shadow:0 0 18px rgba(0,234,255,.65);
    }
    [scx~="BTN-PRIMARY"]:active{transform:scale(.98);}
    [scx~="LOG"]{padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;overflow-y:auto;}
    .title{font-size:19px;font-weight:650;margin-bottom:4px;}
    .subtitle{font-size:11px;opacity:.78;margin-bottom:8px;}
  </style>
</head>
<body>
  <header>
    <div class="logo">ASX STUDIOGEN • NEW STUDIO</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="studio.html" class="active">New Studio</a>
      <a href="github.html">Import GitHub</a>
    </nav>
  </header>

  <div scx="HUD">
    <div scx="PANEL FORM">
      <div class="title">Create New Studio</div>
      <div class="subtitle">Generate a new project on your ASX-RIG using XJSON jobs.</div>

      <div scx="LABEL">Studio Name</div>
      <input scx="INPUT" id="studio-name" placeholder="NeoCommerce XR" />

      <div scx="LABEL">Description</div>
      <textarea scx="TEXTAREA" id="studio-desc"
        placeholder="XR e-commerce dashboard studio powered by Cline + PRIME-XJSON"></textarea>

      <div scx="LABEL">Studio Type</div>
      <select id="studio-type">
        <option value="web">Web Studio</option>
        <option value="game">Game Studio</option>
        <option value="api">API Studio</option>
        <option value="xjson">XJSON Tape Studio</option>
        <option value="ai">AI Multi-Agent Studio</option>
        <option value="auto">Cline Auto Studio</option>
      </select>

      <button scx="BTN-PRIMARY" id="generate-btn">Generate Studio</button>
    </div>

    <div scx="PANEL LOG" id="log"></div>
  </div>

  <script>
    const log = (msg) => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      const t = new Date().toLocaleTimeString();
      line.textContent = `[${t}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log('[StudioGenerator]', msg);
    };

    document.getElementById('generate-btn').onclick = async () => {
      const name = document.getElementById('studio-name').value.trim();
      const desc = document.getElementById('studio-desc').value.trim();
      const type = document.getElementById('studio-type').value;
      if (!name) {
        log('✖ Please enter a studio name.');
        return;
      }
      log(`→ Creating ${type} studio "${name}"...`);
      try {
        const res = await fetch('/api/studio/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description: desc, type })
        });
        const data = await res.json();
        if (!data.ok) {
          log('✖ Error: ' + (data.error || 'unknown'));
          return;
        }
        log('✓ Studio created. Check /projects/' + name + ' on your rig.');
      } catch (e) {
        log('✖ Request failed: ' + e);
      }
    };
  </script>
<script src="/public/asx-runtime.js"></script>

</body>
</html>
