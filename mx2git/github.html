<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MX2GIT • GitHub Import</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#020308;
      --panel:#050915;
      --accent:#00eaff;
      --accent-soft:rgba(0,234,255,.18);
      --text:#e8fff6;
      --success:#16f2aa;
      --danger:#ff1744;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
      background:radial-gradient(circle at top,#071221,#010308 60%,#000 100%);
      color:var(--text);
      min-height:100vh;
    }

    header {
      padding:14px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      backdrop-filter:blur(18px);
      background:linear-gradient(120deg,rgba(0,234,255,.18),rgba(3,12,30,.9));
      border-bottom:1px solid rgba(0,234,255,.4);
    }

    .logo {
      font-weight:700;
      letter-spacing:3px;
      font-size:16px;
      color:var(--accent);
    }

    nav a {
      margin-left:16px;
      font-size:13px;
      text-decoration:none;
      color:var(--text);
      padding:6px 10px;
      border-radius:999px;
      border:1px solid transparent;
      transition:all 0.2s;
    }

    nav a.active, nav a:hover {
      border-color:rgba(0,234,255,.7);
      background:radial-gradient(circle at top,var(--accent-soft),transparent);
    }

    main {
      padding:18px 20px;
      display:grid;
      grid-template-columns:520px 1fr;
      gap:16px;
      max-width:1600px;
      margin:0 auto;
    }

    .card {
      background:linear-gradient(145deg,#050915,#040711);
      border-radius:16px;
      border:1px solid rgba(0,234,255,.35);
      box-shadow:0 0 24px rgba(0,0,0,.8),0 0 18px var(--accent-soft);
      padding:18px;
    }

    .title {
      font-size:19px;
      font-weight:650;
      margin-bottom:4px;
      color:var(--accent);
    }

    .subtitle {
      font-size:11px;
      opacity:.78;
      margin-bottom:16px;
    }

    label {
      font-size:11px;
      letter-spacing:1px;
      text-transform:uppercase;
      opacity:.8;
      display:block;
      margin-bottom:6px;
    }

    input, textarea {
      width:100%;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.15);
      padding:10px 12px;
      background:rgba(1,4,10,.9);
      color:var(--text);
      font-size:13px;
      outline:none;
      margin-bottom:12px;
      font-family:inherit;
    }

    input:focus, textarea:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }

    button {
      padding:10px 16px;
      border-radius:999px;
      border:none;
      background:linear-gradient(120deg,#00eaff,#16f2aa);
      color:#020308;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 0 18px rgba(0,234,255,.65);
      transition:transform 0.1s;
    }

    button:hover {
      box-shadow:0 0 24px rgba(0,234,255,.85);
    }

    button:active {
      transform:scale(.98);
    }

    button.secondary {
      background:linear-gradient(120deg,rgba(255,255,255,.15),rgba(255,255,255,.08));
      color:var(--text);
      box-shadow:none;
    }

    #log {
      font-family:ui-monospace,Consolas,monospace;
      font-size:12px;
      max-height:300px;
      overflow-y:auto;
      background:rgba(0,0,0,.5);
      padding:12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.1);
    }

    #log div {
      margin-bottom:4px;
      padding:4px 0;
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    #log div:last-child {
      border-bottom:none;
    }

    .log-success { color:var(--success); }
    .log-error { color:var(--danger); }
    .log-info { color:var(--accent); }

    .form-group {
      margin-bottom:16px;
    }

    .btn-group {
      display:flex;
      gap:10px;
    }

    .status-badge {
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:10px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .status-ready {
      background:rgba(22,242,170,.2);
      color:var(--success);
      border:1px solid var(--success);
    }

    .status-pending {
      background:rgba(255,193,7,.2);
      color:#ffc107;
      border:1px solid #ffc107;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⚛️ MX2GIT</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="github.html" class="active">Import GitHub</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="title">Import GitHub Repository</div>
      <div class="subtitle">
        Register a repository as a project. You can later sync files between GitHub and ASX-RAM.
      </div>

      <div class="form-group">
        <label>GitHub Token (Stored Securely)</label>
        <input
          id="github-token"
          type="password"
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
          autocomplete="off"
        />
        <button id="save-token-btn" class="secondary">Save Token</button>
      </div>

      <div class="form-group">
        <label>Repository URL</label>
        <input
          id="repo-url"
          placeholder="https://github.com/username/repository.git"
        />
      </div>

      <div class="form-group">
        <label>Project Name (Optional)</label>
        <input
          id="project-name"
          placeholder="Auto-detected from URL if empty"
        />
      </div>

      <div class="btn-group">
        <button id="import-btn">📥 Import Repository</button>
        <button id="clone-btn" class="secondary">⬇️ Clone Full Repo</button>
      </div>
    </section>

    <section class="card">
      <div class="title">Activity Log</div>
      <div class="subtitle">Real-time sync operations and status</div>
      <div id="log"></div>
    </section>
  </main>

  <script>
    const log = (msg, type = 'info') => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      const t = new Date().toLocaleTimeString();

      line.className = `log-${type}`;

      let icon = '→';
      if (type === 'success') icon = '✓';
      if (type === 'error') icon = '✖';

      line.textContent = `[${t}] ${icon} ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log('[MX2GIT]', msg);
    };

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => {
          log('Service worker registered', 'success');
          console.log('MX2GIT SW registered:', reg.scope);
        })
        .catch(err => {
          log('Service worker registration failed: ' + err, 'error');
        });
    }

    // Save GitHub token
    document.getElementById('save-token-btn').onclick = async () => {
      const token = document.getElementById('github-token').value.trim();
      if (!token) {
        log('Please enter a GitHub token', 'error');
        return;
      }

      log('Saving GitHub token...');

      try {
        const res = await fetch('/api/mx2git/save-credentials', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await res.json();

        if (!data.ok) {
          log('Error saving token: ' + (data.error || 'unknown'), 'error');
          return;
        }

        log('Token saved securely in ASX-RAM', 'success');
        document.getElementById('github-token').value = '';
      } catch (e) {
        log('Request failed: ' + e, 'error');
      }
    };

    // Import repository
    document.getElementById('import-btn').onclick = async () => {
      const repo_url = document.getElementById('repo-url').value.trim();
      const project_name = document.getElementById('project-name').value.trim() || null;

      if (!repo_url) {
        log('Please enter a repository URL', 'error');
        return;
      }

      log('Importing repository: ' + repo_url);

      try {
        const res = await fetch('/api/mx2git/import-github', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_url, project_name })
        });

        const data = await res.json();

        if (!data.ok) {
          log('Error: ' + (data.error || 'unknown'), 'error');
          return;
        }

        log('Repository registered successfully', 'success');
        log('Project folder: ' + data.project, 'info');

        document.getElementById('repo-url').value = '';
        document.getElementById('project-name').value = '';
      } catch (e) {
        log('Request failed: ' + e, 'error');
      }
    };

    // Clone repository
    document.getElementById('clone-btn').onclick = async () => {
      const repo_url = document.getElementById('repo-url').value.trim();

      if (!repo_url) {
        log('Please enter a repository URL', 'error');
        return;
      }

      log('Cloning repository (this may take a moment)...');

      try {
        // Parse repo from URL
        const match = repo_url.match(/github\.com\/([^\/]+)\/([^\/\.]+)/);
        if (!match) {
          log('Invalid GitHub URL format', 'error');
          return;
        }

        const repo = `${match[1]}/${match[2]}`;

        const res = await fetch('/api/mx2git/clone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo, branch: 'main' })
        });

        const data = await res.json();

        if (!data.ok) {
          log('Error: ' + (data.error || 'unknown'), 'error');
          return;
        }

        log('Repository cloned successfully', 'success');
        log(`Files downloaded: ${data.result.filesCloned}`, 'info');
        log('Project folder: ' + data.result.project, 'info');

        document.getElementById('repo-url').value = '';
      } catch (e) {
        log('Clone failed: ' + e, 'error');
      }
    };

    // Initial status check
    setTimeout(async () => {
      try {
        const res = await fetch('/api/mx2git/manifest');
        if (res.ok) {
          log('MX2GIT kernel ready', 'success');
        }
      } catch {
        log('MX2GIT kernel not ready - refresh page', 'error');
      }
    }, 500);
  </script>
</body>
</html>
