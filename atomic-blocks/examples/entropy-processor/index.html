<!DOCTYPE html>
<html style="--entropy: 0.6000000000000001;">
<head>
  <title>ENTROPY PROCESSOR v∞</title>
  <style>
    :root {
      --bg-0: #020409; --bg-1: #050912; --bg-2: #0a1220;
      --fg-0: #e8f5ff; --accent: #16f2aa; --danger: #ff6b6b;

      /* ENTROPY FROM YOUR JSON */
      --entropy: 0.6000000000000001;

      /* DERIVED PROPERTIES */
      --energy: calc(var(--entropy) * 0.8);
      --pulse: calc(1 + var(--entropy) * 2);
      --glow: calc(var(--entropy) * 0.7);
      --blur: calc(var(--entropy) * 2px);
      --hue: calc(var(--entropy) * 360);
      --scale: calc(1 + var(--entropy) * 0.15);
      --rotation: calc(var(--entropy) * 10deg);
    }

    body {
      margin: 0;
      background: var(--bg-0);
      color: var(--fg-0);
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ENTROPY CONTAINER */
    .entropy-container {
      background: var(--bg-1);
      border: 2px solid rgba(22, 242, 170, calc(var(--entropy) * 0.3));
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(var(--blur));
      box-shadow:
        0 0 calc(var(--glow) * 40px) rgba(22, 242, 170, calc(var(--entropy) * 0.4)),
        inset 0 0 calc(var(--glow) * 20px) rgba(22, 242, 170, calc(var(--entropy) * 0.1));
      animation: entropy-pulse calc(1s / var(--pulse)) infinite;
      transform: scale(var(--scale)) rotate(var(--rotation));
      transition: all 0.3s ease;
    }

    @keyframes entropy-pulse {
      0%, 100% {
        opacity: 1;
        box-shadow:
          0 0 calc(var(--glow) * 40px) rgba(22, 242, 170, calc(var(--entropy) * 0.4)),
          inset 0 0 calc(var(--glow) * 20px) rgba(22, 242, 170, calc(var(--entropy) * 0.1));
      }
      50% {
        opacity: calc(0.7 + var(--entropy) * 0.3);
        box-shadow:
          0 0 calc(var(--glow) * 60px) rgba(22, 242, 170, calc(var(--entropy) * 0.6)),
          inset 0 0 calc(var(--glow) * 30px) rgba(22, 242, 170, calc(var(--entropy) * 0.2));
      }
    }

    /* ENTROPY VALUE DISPLAY */
    .entropy-value {
      font-size: 48px;
      font-weight: bold;
      color: hsl(var(--hue), 80%, 65%);
      text-shadow:
        0 0 calc(var(--glow) * 15px) currentColor,
        0 0 calc(var(--glow) * 30px) rgba(22, 242, 170, 0.5);
      margin: 20px 0;
      text-align: center;
    }

    /* ENTROPY METER */
    .entropy-meter {
      width: 100%;
      height: 20px;
      background: var(--bg-2);
      border-radius: 10px;
      overflow: hidden;
      margin: 30px 0;
      position: relative;
    }

    .entropy-fill {
      height: 100%;
      width: calc(var(--entropy) * 100%);
      background: linear-gradient(
        90deg,
        var(--bg-1) 0%,
        hsl(var(--hue), 80%, 50%) 50%,
        var(--accent) 100%
      );
      border-radius: 10px;
      animation: flow 2s infinite linear;
      position: relative;
    }

    .entropy-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, calc(var(--entropy) * 0.3)) 50%,
        transparent 100%
      );
      animation: shine 1s infinite;
    }

    @keyframes flow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ENTROPY PARTICLES */
    .entropy-particles {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: calc(var(--entropy) * 8px + 2px);
      height: calc(var(--entropy) * 8px + 2px);
      background: var(--accent);
      border-radius: 50%;
      opacity: calc(var(--entropy) * 0.5);
      animation: float calc(3s / var(--entropy)) infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: calc(var(--entropy) * 0.3);
      }
      50% {
        transform: translate(calc(sin(var(--entropy) * 360deg) * 20px), -20px) scale(1.5);
        opacity: calc(var(--entropy) * 0.8);
      }
    }

    /* ENTROPY CONTROLS */
    .entropy-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 30px;
      width: 100%;
    }

    .control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(22, 242, 170, calc(var(--entropy) * 0.2));
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control:hover {
      background: rgba(22, 242, 170, calc(var(--entropy) * 0.1));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(22, 242, 170, calc(var(--entropy) * 0.2));
    }

    /* ENTROPY STATES */
    .state-low { color: #9fb3c8; }
    .state-medium { color: #16f2aa; }
    .state-high { color: #ff6b6b; animation: danger-pulse 0.5s infinite; }

    @keyframes danger-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ENTROPY READOUT */
    .readout {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 5px;
    }

    /* ENTROPY GRID VISUAL */
    .entropy-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin: 30px 0;
    }

    .grid-cell {
      aspect-ratio: 1;
      background: var(--bg-2);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .grid-cell.active {
      background: hsl(var(--hue), 80%, 50%);
      box-shadow: 0 0 10px currentColor;
    }
  </style>
</head>
<body>
  <div class="entropy-container">
    <!-- ENTROPY VALUE -->
    <div class="entropy-value" id="entropy-display">
      0.6000000000000001
    </div>

    <!-- ENTROPY METER -->
    <div class="entropy-meter">
      <div class="entropy-fill"></div>
    </div>

    <!-- ENTROPY STATE -->
    <div style="text-align: center; margin: 20px 0;">
      <div class="state-high" style="font-size: 24px; font-weight: bold;" id="state-display">
        HIGH ENTROPY DETECTED
      </div>
      <div class="readout" id="state-readout">
        System complexity: 60% • Innovation pressure: High
      </div>
    </div>

    <!-- ENTROPY GRID VISUAL -->
    <div class="entropy-grid" id="entropy-grid">
      <!-- Grid cells will be generated by JS -->
    </div>

    <!-- ENTROPY CONTROLS -->
    <div class="entropy-controls">
      <div class="control" onclick="adjustEntropy(0.1)">
        <div>⬆ INCREASE</div>
        <div class="readout">+0.1 entropy</div>
      </div>

      <div class="control" onclick="adjustEntropy(-0.1)">
        <div>⬇ DECREASE</div>
        <div class="readout">-0.1 entropy</div>
      </div>

      <div class="control" onclick="randomizeEntropy()">
        <div>🎲 RANDOMIZE</div>
        <div class="readout">Generate new entropy</div>
      </div>

      <div class="control" onclick="stabilizeEntropy()">
        <div>⚖️ STABILIZE</div>
        <div class="readout">Reduce to 0.3</div>
      </div>
    </div>

    <!-- ENTROPY ANALYSIS -->
    <div style="margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 12px;">
      <h3 style="margin-top: 0;">ENTROPY ANALYSIS</h3>
      <div id="entropy-analysis">
        Calculating entropy effects...
      </div>
    </div>
  </div>

  <!-- ENTROPY PARTICLES -->
  <div class="entropy-particles" id="particles-container">
    <!-- Particles generated by JS -->
  </div>

  <script>
    // Initialize with your entropy value
    const root = document.documentElement;
    let entropy = 0.6000000000000001;

    // Update CSS variables
    function updateEntropyCSS() {
      root.style.setProperty('--entropy', entropy);

      // Update display
      document.getElementById('entropy-display').textContent = entropy.toFixed(15);

      // Update state
      const stateDisplay = document.getElementById('state-display');
      const stateReadout = document.getElementById('state-readout');

      if (entropy < 0.3) {
        stateDisplay.className = 'state-low';
        stateDisplay.textContent = 'LOW ENTROPY';
        stateReadout.textContent = 'System stability: High • Innovation: Low';
      } else if (entropy < 0.7) {
        stateDisplay.className = 'state-medium';
        stateDisplay.textContent = 'MEDIUM ENTROPY';
        stateReadout.textContent = 'System complexity: Optimal • Innovation: Active';
      } else {
        stateDisplay.className = 'state-high';
        stateDisplay.textContent = 'HIGH ENTROPY';
        stateReadout.textContent = 'System stress: High • Innovation pressure: Critical';
      }

      // Update analysis
      updateEntropyAnalysis();

      // Update grid
      updateEntropyGrid();

      // Update particles
      updateParticles();
    }

    // Adjust entropy
    function adjustEntropy(delta) {
      entropy = Math.max(0, Math.min(1, entropy + delta));
      updateEntropyCSS();
    }

    // Randomize entropy
    function randomizeEntropy() {
      entropy = Math.random();
      updateEntropyCSS();
    }

    // Stabilize entropy
    function stabilizeEntropy() {
      entropy = 0.3;
      updateEntropyCSS();
    }

    // Update entropy analysis
    function updateEntropyAnalysis() {
      const analysis = document.getElementById('entropy-analysis');
      const effects = [];

      if (entropy > 0.8) {
        effects.push('⚡ High innovation potential');
        effects.push('🌀 Complex pattern formation');
        effects.push('🎨 Rich visual diversity');
        effects.push('⚠️ Stability compromised');
      } else if (entropy > 0.5) {
        effects.push('⚡ Moderate innovation');
        effects.push('🌀 Balanced complexity');
        effects.push('🎨 Dynamic visuals');
        effects.push('✓ System optimal');
      } else {
        effects.push('⚡ Low innovation');
        effects.push('🌀 Simple patterns');
        effects.push('🎨 Stable visuals');
        effects.push('✓ High stability');
      }

      // Add mathematical properties
      effects.push(`📐 Shannon entropy: ${(-entropy * Math.log2(entropy) - (1-entropy) * Math.log2(1-entropy)).toFixed(3)} bits`);
      effects.push(`🎯 Target range: ${entropy > 0.4 && entropy < 0.7 ? 'Optimal' : 'Suboptimal'}`);

      analysis.innerHTML = effects.map(e => `<div style="margin: 5px 0;">${e}</div>`).join('');
    }

    // Update entropy grid visualization
    function updateEntropyGrid() {
      const grid = document.getElementById('entropy-grid');
      grid.innerHTML = '';

      const cells = 100;
      const activeCells = Math.floor(entropy * cells);

      for (let i = 0; i < cells; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';

        // Activate cells based on entropy
        if (i < activeCells) {
          // Add delay based on position for animation
          cell.style.animationDelay = `${(i % 10) * 0.1}s`;
          cell.classList.add('active');
        }

        grid.appendChild(cell);
      }
    }

    // Update particles
    function updateParticles() {
      const container = document.getElementById('particles-container');
      container.innerHTML = '';

      const particleCount = Math.floor(entropy * 50) + 10;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // Random position
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;

        // Random animation delay
        particle.style.animationDelay = `${Math.random() * 2}s`;

        // Size based on entropy
        particle.style.width = particle.style.height =
          `${(entropy * 8 + Math.random() * 4)}px`;

        // Color variation
        const hue = entropy * 360 + Math.random() * 30 - 15;
        particle.style.background = `hsl(${hue}, 80%, 60%)`;

        container.appendChild(particle);
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateEntropyCSS();

      // Add some interactive effects
      document.querySelectorAll('.control').forEach(control => {
        control.addEventListener('mouseenter', () => {
          control.style.transform = 'translateY(-2px) scale(1.02)';
        });

        control.addEventListener('mouseleave', () => {
          control.style.transform = '';
        });
      });

      // Auto-update grid cells periodically
      setInterval(() => {
        const cells = document.querySelectorAll('.grid-cell.active');
        cells.forEach(cell => {
          // Randomly toggle some cells for dynamic effect
          if (Math.random() < 0.1) {
            cell.classList.toggle('active');
          }
        });
      }, 1000);
    });
  </script>
</body>
</html>
