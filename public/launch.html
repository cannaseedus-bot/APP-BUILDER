<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Launch MX2LM.APP</title>
    <meta http-equiv="refresh" content="2;url=index.html">
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .launching {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            border-top: 4px solid #0f0;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="launching">
        <h1>🚀 Launching MX2LM.APP</h1>
        <div class="spinner"></div>
        <p>Starting K'UHUL bootloader...</p>
        <p>Redirecting to runtime...</p>
    </div>
</body>
</html>
