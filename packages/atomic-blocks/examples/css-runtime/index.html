<!DOCTYPE html>
<html style="--entropy: 0; --velocity: 1; --signal: 0;">
<head>
  <meta charset="UTF-8">
  <title>CSS RUNTIME v∞</title>

  <!-- Your Atomic CSS (enhanced) -->
  <style>
    :root{
      /* core palette */
      --bg-0:#020409; --bg-1:#050912; --bg-2:#0a1220;
      --panel:rgba(255,255,255,.06);
      --fg-0:#e8f5ff; --fg-1:#9fb3c8;
      --accent:#16f2aa; --accent-soft:rgba(22,242,170,.25);
      --hazard:#ffb300; --danger:#ff6b6b;

      /* xcfe + runtime */
      --entropy:0; --velocity:1; --signal:0; --hazard-state:0;

      /* physics */
      --px:0; --py:0; --rot:0; --force-x:0; --force-y:0; --mass:1;

      /* visual runtime */
      --glow:0; --blur:0; --z:0;

      /* spacing */
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
      --r1:4px; --r2:8px; --r3:12px;
      --fs0:12px; --fs1:14px; --fs2:16px;

      /* API State */
      --api-glyph-⟁: 'none';
      --api-glyph-⚡: 'none';
      --api-glyph-🌀: 'none';
      --api-glyph-🧬: 'none';
      --api-glyph-🎨: 'none';
      --api-state: 'idle';
      --api-response: '{}';
    }

    /* ===============================
       GLYPH API - CSS CONTROLLED
       =============================== */

    /* GLYPH VISIBILITY = API STATE */
    .glyph-⟁ { display: var(--api-glyph-⟁); }
    .glyph-⚡ { display: var(--api-glyph-⚡); }
    .glyph-🌀 { display: var(--api-glyph-🌀); }
    .glyph-🧬 { display: var(--api-glyph-🧬); }
    .glyph-🎨 { display: var(--api-glyph-🎨); }

    /* API RESPONSE VISUALIZATION */
    .api-response::after {
      content: var(--api-response);
      display: block;
      font-family: monospace;
      font-size: var(--fs0);
      color: var(--accent);
      white-space: pre-wrap;
      background: var(--panel);
      padding: var(--s2);
      border-radius: var(--r1);
      margin-top: var(--s2);
      border: 1px solid var(--accent-soft);
    }

    /* API STATE INDICATORS */
    .api-idle {
      border-left: 3px solid var(--fg-1);
      opacity: 0.7;
    }

    .api-processing {
      border-left: 3px solid var(--accent);
      animation: api-pulse 1s infinite;
    }

    .api-success {
      border-left: 3px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-soft);
    }

    .api-error {
      border-left: 3px solid var(--danger);
      animation: shake 0.3s;
    }

    @keyframes api-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===============================
       CSS CUSTOM PROPERTY API
       =============================== */

    /* CONTROL FLOW VIA CSS VARIABLES */
    [data-api-if="true"] { display: block; }
    [data-api-if="false"] { display: none; }

    [data-api-loop] {
      animation: api-loop calc(var(--api-loop-speed, 1) * 1s) infinite;
    }

    @keyframes api-loop {
      0% { opacity: 1; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* API DATA BINDING */
    [data-bind]::after {
      content: attr(data-bind);
      color: var(--accent);
      font-weight: bold;
    }

    /* GLYPH HOVER = API PREVIEW */
    .glyph-container:hover {
      --glow: 0.8;
      --blur: 0;
    }

    .glyph-container:hover::before {
      content: 'API: ' attr(data-api-endpoint);
      position: absolute;
      top: -30px;
      left: 0;
      background: var(--panel);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: var(--r1);
      font-size: 11px;
      white-space: nowrap;
      border: 1px solid var(--accent-soft);
      backdrop-filter: blur(10px);
    }

    /* ===============================
       RUNTIME VISUALIZATION
       =============================== */

    /* ENTROPY VISUALIZATION */
    .entropy-visual {
      width: 100%;
      height: 4px;
      background: linear-gradient(
        90deg,
        var(--bg-1) 0%,
        var(--accent) calc(var(--entropy) * 100%),
        var(--bg-1) 100%
      );
      border-radius: 2px;
      margin: var(--s2) 0;
    }

    /* SIGNAL STRENGTH */
    .signal-visual {
      width: calc(var(--signal) * 100%);
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.2s ease;
    }

    /* HAZARD STATE */
    .hazard-visual {
      background: var(--hazard);
      opacity: calc(var(--hazard-state) * 0.3);
      border: 1px solid var(--hazard);
      animation: hazard-pulse calc(1s / var(--hazard-state, 1)) infinite;
    }

    /* ===============================
       PHYSICS SIMULATION
       =============================== */

    .physics-box {
      position: absolute;
      width: 50px;
      height: 50px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--r1);
      transform:
        translate(
          calc(var(--px) * 1px),
          calc(var(--py) * 1px)
        )
        rotate(calc(var(--rot) * 1deg));
      transition:
        transform calc(0.1s / var(--velocity, 1)),
        background calc(0.2s / var(--velocity, 1));
    }

    .physics-box.collision {
      background: var(--danger);
      animation: collision-shake 0.3s;
    }

    /* ===============================
       YOUR EXISTING ATOMIC CSS
       =============================== */
    [⟁flex]{display:flex}
    [⟁grid]{display:grid}
    [⟁col]{flex-direction:column}
    [⟁row]{flex-direction:row}
    [⟁wrap]{flex-wrap:wrap}
    [⟁center]{display:flex;align-items:center;justify-content:center}
    [⟁fill]{width:100%;height:100%}

    [⟁p1]{padding:var(--s1)}
    [⟁p2]{padding:var(--s2)}
    [⟁p3]{padding:var(--s3)}
    [⟁p4]{padding:var(--s4)}

    [⟁g1]{gap:var(--s1)}
    [⟁g2]{gap:var(--s2)}
    [⟁g3]{gap:var(--s3)}
    [⟁g4]{gap:var(--s4)}

    [⟁text]{color:var(--fg-0)}
    [⟁muted]{color:var(--fg-1)}
    [⟁fs0]{font-size:var(--fs0)}
    [⟁fs1]{font-size:var(--fs1)}
    [⟁fs2]{font-size:var(--fs2)}
    [⟁mono]{font-family:monospace}

    [⟁bg0]{background:var(--bg-0)}
    [⟁bg1]{background:var(--bg-1)}
    [⟁bg2]{background:var(--bg-2)}

    [⟁ghost]{
      background:var(--panel);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.12);
      border-radius:var(--r2)
    }
    [⟁ghost-strong]{
      backdrop-filter:blur(14px);
      background:rgba(255,255,255,.1)
    }
    [⟁ghost-accent]{
      border-color:var(--accent);
      box-shadow:0 0 12px var(--accent-soft)
    }

    .xcfe-if{display:none}
    .xcfe-if.active{display:block}

    .xcfe-perception{
      filter:blur(calc(var(--blur)*1px))
    }
    .xcfe-representation{
      transform:scale(calc(1 + var(--entropy)*0.1))
    }
    .xcfe-reasoning{
      border-left:3px solid var(--accent);
      padding-left:var(--s2)
    }
    .xcfe-decision{
      color:var(--accent);
      font-weight:600
    }
    .xcfe-action{
      background:var(--accent-soft)
    }
    .xcfe-reflection{
      opacity:.7
    }

    .xcfe-signal{
      box-shadow:0 0 calc(var(--glow)*8px) var(--accent)
    }

    .xcfe-hazard{
      border:2px solid var(--hazard);
      animation:pulse 1s infinite
    }
    .xcfe-danger{
      border:2px solid var(--danger);
      background:rgba(255,107,107,.15)
    }

    /* ===============================
       API-CONTROLLED ANIMATIONS
       =============================== */

    @property --api-progress {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 0%;
    }

    .api-progress {
      width: 100%;
      height: 2px;
      background: linear-gradient(
        to right,
        var(--accent) var(--api-progress),
        transparent var(--api-progress)
      );
      transition: --api-progress 0.3s ease;
    }
  </style>
</head>

<body ⟁flex ⟁col ⟁fill ⟁bg0 ⟁text ⟁p4 style="--api-state: 'idle';">

  <!-- ==================== CSS RUNTIME CONTROLLER ==================== -->
  <div ⟁flex ⟁col ⟁g4 ⟁p4 ⟁ghost style="max-width: 800px; margin: auto;">

    <!-- RUNTIME HEADER -->
    <div ⟁flex ⟁row ⟁jbetween ⟁acenter>
      <h1 ⟁fs2 style="color: var(--accent);">CSS RUNTIME v∞</h1>
      <div ⟁flex ⟁row ⟁g2 ⟁acenter>
        <div class="api-state-indicator" style="
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: var(--accent);
          opacity: var(--signal);
        "></div>
        <span ⟁muted>API State: <span id="api-state-label">IDLE</span></span>
      </div>
    </div>

    <!-- GLYPH API VISUALIZER -->
    <div ⟁flex ⟁col ⟁g3>
      <h3 ⟁fs1>GLYPH API ENDPOINTS</h3>
      <div ⟁flex ⟁row ⟁wrap ⟁g2>

        <!-- GLYPH ⟁ = SCX OPERATIONS API -->
        <div class="glyph-container glyph-⟁" data-api-endpoint="/scx/execute"
             ⟁flex ⟁center ⟁ghost-accent ⟁p3 ⟁rounded style="cursor: pointer;"
             onclick="callGlyphAPI('⟁')">
          <span style="font-size: 24px;">⟁</span>
          <span ⟁muted ⟁fs0 style="margin-left: 8px;">SCX Execute</span>
        </div>

        <!-- GLYPH ⚡ = CONTROL FLOW API -->
        <div class="glyph-container glyph-⚡" data-api-endpoint="/control/flow"
             ⟁flex ⟁center ⟁ghost-accent ⟁p3 ⟁rounded style="cursor: pointer;"
             onclick="callGlyphAPI('⚡')">
          <span style="font-size: 24px;">⚡</span>
          <span ⟁muted ⟁fs0 style="margin-left: 8px;">Control Flow</span>
        </div>

        <!-- GLYPH 🌀 = STATE VARIABLE API -->
        <div class="glyph-container glyph-🌀" data-api-endpoint="/state/variable"
             ⟁flex ⟁center ⟁ghost-accent ⟁p3 ⟁rounded style="cursor: pointer;"
             onclick="callGlyphAPI('🌀')">
          <span style="font-size: 24px;">🌀</span>
          <span ⟁muted ⟁fs0 style="margin-left: 8px;">State Variable</span>
        </div>

        <!-- GLYPH 🧬 = EXECUTION ENGINE API -->
        <div class="glyph-container glyph-🧬" data-api-endpoint="/execution/engine"
             ⟁flex ⟁center ⟁ghost-accent ⟁p3 ⟁rounded style="cursor: pointer;"
             onclick="callGlyphAPI('🧬')">
          <span style="font-size: 24px;">🧬</span>
          <span ⟁muted ⟁fs0 style="margin-left: 8px;">Execution Engine</span>
        </div>

        <!-- GLYPH 🎨 = RENDER ENGINE API -->
        <div class="glyph-container glyph-🎨" data-api-endpoint="/render/engine"
             ⟁flex ⟁center ⟁ghost-accent ⟁p3 ⟁rounded style="cursor: pointer;"
             onclick="callGlyphAPI('🎨')">
          <span style="font-size: 24px;">🎨</span>
          <span ⟁muted ⟁fs0 style="margin-left: 8px;">Render Engine</span>
        </div>
      </div>
    </div>

    <!-- API RESPONSE AREA -->
    <div ⟁flex ⟁col ⟁g2>
      <h3 ⟁fs1>API RESPONSE</h3>
      <div id="api-response-display" class="api-response" ⟁ghost ⟁p3 ⟁rounded
           style="min-height: 100px; font-family: monospace; font-size: var(--fs0);">
        {/* API responses appear here */}
      </div>
    </div>

    <!-- RUNTIME CONTROLS VIA CSS VARIABLES -->
    <div ⟁grid style="grid-template-columns: repeat(3, 1fr); gap: var(--s3);">

      <!-- ENTROPY CONTROL -->
      <div ⟁flex ⟁col ⟁g1 ⟁ghost ⟁p3 ⟁rounded>
        <label ⟁muted ⟁fs0>Entropy</label>
        <input type="range" min="0" max="100" value="0"
               oninput="updateCSSRuntime('--entropy', this.value / 100)">
        <div class="entropy-visual"></div>
      </div>

      <!-- VELOCITY CONTROL -->
      <div ⟁flex ⟁col ⟁g1 ⟁ghost ⟁p3 ⟁rounded>
        <label ⟁muted ⟁fs0>Velocity</label>
        <input type="range" min="1" max="10" value="1"
               oninput="updateCSSRuntime('--velocity', this.value)">
        <div style="width: 100%; height: 2px; background: var(--fg-1);">
          <div class="signal-visual"></div>
        </div>
      </div>

      <!-- SIGNAL CONTROL -->
      <div ⟁flex ⟁col ⟁g1 ⟁ghost ⟁p3 ⟁rounded>
        <label ⟁muted ⟁fs0>Signal</label>
        <input type="range" min="0" max="100" value="0"
               oninput="updateCSSRuntime('--signal', this.value / 100)">
        <div style="width: 100%; height: 4px; background: var(--bg-1); border-radius: 2px;">
          <div style="width: calc(var(--signal) * 100%); height: 100%; background: var(--accent); border-radius: 2px;"></div>
        </div>
      </div>

      <!-- GLOW CONTROL -->
      <div ⟁flex ⟁col ⟁g1 ⟁ghost ⟁p3 ⟁rounded>
        <label ⟁muted ⟁fs0>Glow</label>
        <input type="range" min="0" max="100" value="0"
               oninput="updateCSSRuntime('--glow', this.value / 100)">
        <div style="width: 100%; height: 4px; background: var(--bg-1); border-radius: 2px; position: relative;">
          <div style="width: 100%; height: 100%; background: var(--accent); border-radius: 2px; opacity: var(--glow);"></div>
        </div>
      </div>

      <!-- BLUR CONTROL -->
      <div ⟁flex ⟁col ⟁g1 ⟁ghost ⟁p3 ⟁rounded>
        <label ⟁muted ⟁fs0>Blur</label>
        <input type="range" min="0" max="100" value="0"
               oninput="updateCSSRuntime('--blur', this.value)">
        <div style="width: 100%; height: 4px; background: var(--bg-1); border-radius: 2px;">
          <div style="width: 100%; height: 100%; background: var(--fg-1); border-radius: 2px; filter: blur(calc(var(--blur) * 0.1px));"></div>
        </div>
      </div>

      <!-- HAZARD STATE -->
      <div ⟁flex ⟁col ⟁g1 ⟁ghost ⟁p3 ⟁rounded>
        <label ⟁muted ⟁fs0>Hazard State</label>
        <input type="range" min="0" max="100" value="0"
               oninput="updateCSSRuntime('--hazard-state', this.value / 100)">
        <div class="hazard-visual" style="width: 100%; height: 4px; border-radius: 2px;"></div>
      </div>
    </div>

    <!-- PHYSICS SIMULATION -->
    <div ⟁flex ⟁col ⟁g2>
      <h3 ⟁fs1>PHYSICS SIMULATION</h3>
      <div style="position: relative; width: 100%; height: 200px; background: var(--bg-1); border-radius: var(--r2); overflow: hidden;">
        <div class="physics-box" id="physics-object"
             style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
      </div>
      <div ⟁flex ⟁row ⟁g2 style="margin-top: var(--s2);">
        <button onclick="applyPhysicsForce('x', 50)">→ Force X+</button>
        <button onclick="applyPhysicsForce('x', -50)">← Force X-</button>
        <button onclick="applyPhysicsForce('y', 50)">↓ Force Y+</button>
        <button onclick="applyPhysicsForce('y', -50)">↑ Force Y-</button>
        <button onclick="resetPhysics()">Reset Physics</button>
      </div>
    </div>

    <!-- XCFE CONTROL FLOW -->
    <div ⟁flex ⟁col ⟁g2>
      <h3 ⟁fs1>XCFE CONTROL FLOW</h3>
      <div ⟁flex ⟁row ⟁wrap ⟁g2>
        <button class="xcfe-perception" onclick="toggleXCFEState('perception')">Perception</button>
        <button class="xcfe-representation" onclick="toggleXCFEState('representation')">Representation</button>
        <button class="xcfe-reasoning" onclick="toggleXCFEState('reasoning')">Reasoning</button>
        <button class="xcfe-decision" onclick="toggleXCFEState('decision')">Decision</button>
        <button class="xcfe-action" onclick="toggleXCFEState('action')">Action</button>
        <button class="xcfe-reflection" onclick="toggleXCFEState('reflection')">Reflection</button>
      </div>
    </div>
  </div>

  <!-- ==================== CSS API ENGINE ==================== -->
  <script>
    // CSS RUNTIME CONTROLLER
    class CSSRuntime {
      constructor() {
        this.root = document.documentElement;
        this.apiState = 'idle';
        this.activeGlyphs = new Set();
        this.physicsState = { x: 0, y: 0, rot: 0 };

        // Initialize CSS API
        this.init();
      }

      init() {
        console.log('🎨 CSS Runtime Initialized');

        // Set up CSS variable watchers
        this.watchCSSVariable('--entropy', (value) => {
          this.updateAPIResponse({ entropy: value });
        });

        this.watchCSSVariable('--signal', (value) => {
          document.getElementById('api-state-label').textContent =
            value > 0.5 ? 'ACTIVE' : 'IDLE';
        });

        // Start physics simulation
        this.startPhysicsLoop();
      }

      // Update CSS custom property
      updateCSSVariable(name, value) {
        this.root.style.setProperty(name, value);
        return this;
      }

      // Watch CSS variable changes
      watchCSSVariable(name, callback) {
        const observer = new MutationObserver(() => {
          const value = getComputedStyle(this.root).getPropertyValue(name).trim();
          callback(value);
        });

        observer.observe(this.root, {
          attributes: true,
          attributeFilter: ['style']
        });
      }

      // Call Glyph API (CSS-controlled)
      async callGlyphAPI(glyph) {
        // Update API state via CSS
        this.updateCSSVariable('--api-state', 'processing');
        this.updateCSSVariable(`--api-glyph-${glyph}`, 'block');

        // Add to active glyphs
        this.activeGlyphs.add(glyph);

        // Simulate API call with CSS animations
        await this.simulateAPICall(glyph);

        // Update response via CSS content property
        const response = this.generateAPIResponse(glyph);
        this.updateCSSVariable('--api-response', JSON.stringify(response, null, 2));

        // Update state
        this.updateCSSVariable('--api-state', 'success');

        // Remove glyph after delay
        setTimeout(() => {
          this.updateCSSVariable(`--api-glyph-${glyph}`, 'none');
          this.activeGlyphs.delete(glyph);

          if (this.activeGlyphs.size === 0) {
            this.updateCSSVariable('--api-state', 'idle');
          }
        }, 2000);
      }

      async simulateAPICall(glyph) {
        return new Promise(resolve => {
          // Show processing animation
          const duration = 1000 + Math.random() * 1000;

          // Update progress via CSS
          let progress = 0;
          const interval = setInterval(() => {
            progress += 10;
            this.updateCSSVariable('--api-progress', `${progress}%`);

            if (progress >= 100) {
              clearInterval(interval);
              resolve();
            }
          }, duration / 10);
        });
      }

      generateAPIResponse(glyph) {
        const responses = {
          '⟁': {
            endpoint: '/scx/execute',
            operation: 'atomic_css',
            result: {
              applied: ['flex', 'grid', 'ghost', 'accent'],
              compression: Math.random() * 0.8 + 0.2,
              timestamp: Date.now()
            }
          },
          '⚡': {
            endpoint: '/control/flow',
            operation: 'conditional_execution',
            result: {
              condition: 'entropy > 0.5',
              executed: true,
              branch: 'innovation_path'
            }
          },
          '🌀': {
            endpoint: '/state/variable',
            operation: 'state_update',
            result: {
              variables: {
                entropy: getComputedStyle(this.root).getPropertyValue('--entropy').trim(),
                velocity: getComputedStyle(this.root).getPropertyValue('--velocity').trim(),
                signal: getComputedStyle(this.root).getPropertyValue('--signal').trim()
              }
            }
          },
          '🧬': {
            endpoint: '/execution/engine',
            operation: 'kuhul_execution',
            result: {
              phases: ['Pop', 'Wo', 'Sek', 'Xul', 'Ch\'en'],
              completed: true,
              execution_time: Math.random() * 100 + 50
            }
          },
          '🎨': {
            endpoint: '/render/engine',
            operation: 'visualization',
            result: {
              rendered: true,
              elements: 42,
              performance: Math.random() * 60 + 40
            }
          }
        };

        return responses[glyph] || { error: 'Unknown glyph' };
      }

      // PHYSICS ENGINE
      startPhysicsLoop() {
        const physicsObject = document.getElementById('physics-object');

        setInterval(() => {
          // Apply forces from CSS variables
          const forceX = parseFloat(getComputedStyle(this.root).getPropertyValue('--force-x')) || 0;
          const forceY = parseFloat(getComputedStyle(this.root).getPropertyValue('--force-y')) || 0;
          const mass = parseFloat(getComputedStyle(this.root).getPropertyValue('--mass')) || 1;

          // Update position (simplified physics)
          this.physicsState.x += forceX / mass;
          this.physicsState.y += forceY / mass;

          // Apply friction
          this.physicsState.x *= 0.95;
          this.physicsState.y *= 0.95;

          // Update CSS variables
          this.updateCSSVariable('--px', this.physicsState.x);
          this.updateCSSVariable('--py', this.physicsState.y);

          // Check boundaries (simulate collision)
          const rect = physicsObject.getBoundingClientRect();
          const container = physicsObject.parentElement.getBoundingClientRect();

          if (rect.left <= container.left || rect.right >= container.right ||
              rect.top <= container.top || rect.bottom >= container.bottom) {
            physicsObject.classList.add('collision');
            setTimeout(() => physicsObject.classList.remove('collision'), 300);
          }
        }, 16); // ~60fps
      }

      applyPhysicsForce(axis, force) {
        const current = parseFloat(getComputedStyle(this.root).getPropertyValue(`--force-${axis}`)) || 0;
        this.updateCSSVariable(`--force-${axis}`, current + force);
      }

      resetPhysics() {
        this.physicsState = { x: 0, y: 0, rot: 0 };
        this.updateCSSVariable('--px', 0);
        this.updateCSSVariable('--py', 0);
        this.updateCSSVariable('--force-x', 0);
        this.updateCSSVariable('--force-y', 0);
      }

      toggleXCFEState(phase) {
        const element = document.querySelector(`.xcfe-${phase}`);
        element.classList.toggle('active');

        // Update entropy based on active phases
        const activePhases = document.querySelectorAll('.xcfe-reasoning.active, .xcfe-decision.active, .xcfe-action.active').length;
        const entropy = activePhases * 0.2;
        this.updateCSSVariable('--entropy', Math.min(1, entropy));
      }

      updateAPIResponse(data) {
        const display = document.getElementById('api-response-display');
        display.textContent = JSON.stringify(data, null, 2);
      }
    }

    // GLOBAL FUNCTIONS
    let cssRuntime;

    function updateCSSRuntime(name, value) {
      if (!cssRuntime) cssRuntime = new CSSRuntime();
      cssRuntime.updateCSSVariable(name, value);
    }

    function callGlyphAPI(glyph) {
      if (!cssRuntime) cssRuntime = new CSSRuntime();
      cssRuntime.callGlyphAPI(glyph);
    }

    function applyPhysicsForce(axis, force) {
      if (!cssRuntime) cssRuntime = new CSSRuntime();
      cssRuntime.applyPhysicsForce(axis, force);
    }

    function resetPhysics() {
      if (cssRuntime) cssRuntime.resetPhysics();
    }

    function toggleXCFEState(phase) {
      if (!cssRuntime) cssRuntime = new CSSRuntime();
      cssRuntime.toggleXCFEState(phase);
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      cssRuntime = new CSSRuntime();

      // Set up initial CSS API state
      cssRuntime.updateCSSVariable('--api-glyph-⟁', 'block');
      cssRuntime.updateCSSVariable('--api-glyph-⚡', 'block');
      cssRuntime.updateCSSVariable('--api-glyph-🌀', 'block');
      cssRuntime.updateCSSVariable('--api-glyph-🧬', 'block');
      cssRuntime.updateCSSVariable('--api-glyph-🎨', 'block');

      // Initial API response
      cssRuntime.updateAPIResponse({
        system: 'CSS Runtime v∞',
        status: 'online',
        endpoints: ['⟁', '⚡', '🌀', '🧬', '🎨'],
        timestamp: Date.now()
      });
    });
  </script>
</body>
</html>
